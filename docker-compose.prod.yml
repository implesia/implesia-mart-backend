# Production API on the VPS (Caddy in front, terminating TLS for the sslip.io hostname).
# Local development keeps using docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Uploads go to Cloudflare R2 when .env.production sets S3_ENDPOINT_URL,
# S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, and MEDIA_PUBLIC_BASE_URL
# together. Leave all five empty to keep writing the named volume `media`
# (the local fallback, and the source for the one-time copy into R2).
# See docs/deploy-media-persistence.md.
name: implesia-mart-prod

services:
  api:
    build: .
    image: implesia-mart-backend:prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    # Bind to loopback only; Caddy on the host proxies to it.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - media:/srv/media

volumes:
  media:
    name: implesia-mart-media
