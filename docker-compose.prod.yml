# Production API + Redis 7 on the VPS (Caddy on host terminates TLS and proxies to 127.0.0.1:8000).
# Local development keeps using docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Concurrency & PostgreSQL Pool Math (default PG max_connections = 100):
#   WEB_CONCURRENCY (default 3) * (DB_POOL_SIZE (10) + DB_MAX_OVERFLOW (10)) = 60 max DB connections
#   (< 100 PG max_connections, leaving 40 connections headroom for migrations, pg_dump, and admin).
#   WebSocket connections hold ZERO PostgreSQL sessions in the loop and share events across workers via Redis 7.
#
# Uploads go to Cloudflare R2 when .env.production sets S3_ENDPOINT_URL,
# S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, and MEDIA_PUBLIC_BASE_URL
# together. Leave all five empty to keep writing the named volume `media`.
# See docs/deploy-media-persistence.md.
name: implesia-mart-prod

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: implesia-mart-backend:prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    # Bind to loopback only; Caddy on the host proxies HTTP & WebSocket (/api/v1/ws) to it.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - media:/srv/media

volumes:
  media:
    name: implesia-mart-media
  redis_data:
    name: implesia-mart-redis-data
