name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: implesia_mart
          POSTGRES_PASSWORD: implesia_mart
          POSTGRES_DB: implesia_mart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U implesia_mart -d implesia_mart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app scripts

      - name: Test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: implesia_mart
          POSTGRES_PASSWORD: implesia_mart
          POSTGRES_DB: implesia_mart
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Build image
        run: docker build --tag implesia-mart-backend:ci .
