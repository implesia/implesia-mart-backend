# Local development only. Do not deploy this file.
# Reload, source mounts, and the local database password stay here.
# Production is render.yaml: managed Postgres, managed Redis, Gunicorn, no reload.
name: implesia-mart-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local volume password. Production credentials come from Render.
      POSTGRES_USER: ${POSTGRES_USER:-implesia_mart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-implesia_mart}
      POSTGRES_DB: ${POSTGRES_DB:-implesia_mart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on 5434 so it does not clash with implesia-backend (5433)
    # or a Postgres already installed on the host. Inside the compose
    # network the port is still 5432.
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-implesia_mart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # These override .env so this stack cannot boot as production
      # or follow a hosted DATABASE_URL pasted into that file.
      ENVIRONMENT: local
      DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.create_superuser &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./media:/srv/media

volumes:
  postgres_data:
  redis_data:
