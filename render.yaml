databases:
  - name: implesia-mart-db
    databaseName: implesia_mart
    user: implesia_mart
    plan: free
    region: singapore

services:
  - type: keyvalue
    name: implesia-mart-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: implesia-mart-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://impleasia.com,https://www.impleasia.com
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@implesia.com
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: implesia-mart-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: implesia-mart-redis
          type: keyvalue
          property: connectionString
